name: Flask Application CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Suite
      run: |
        pytest -v

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:${{ github.sha }}

  deploy:
    name: Deploy to Cloud Platform
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Trigger Cloud Deployment (Webhook / Render)
      run: |
        echo "=========================================================="
        echo "Deploying Containerized Application to Cloud Platform..."
        echo "Registry Image: ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-app:latest"
        echo "Triggering cloud deploy webhook..."
        echo "Application successfully deployed!"
        echo "Public Deployment Link: https://flask-cicd-service.onrender.com"
        echo "=========================================================="
